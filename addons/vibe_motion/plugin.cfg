[plugin]

name="Vibe Motion"
description="Animações por texto (PT/EN) para personagens humanoides: andar, correr, pular, acenar, dançar, sentar, lutar, magia... em uma frase. Manequim procedural nos 5 estilos, esqueleto humanoide padrão do Godot (reaproveita em qualquer modelo com BoneMap), conector opcional para o Kimodo (kimodo.cpp) e importação de BVH/GLB."
